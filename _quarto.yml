project:
  type: book
  output-dir: _book
  execute:
    enabled: false

lang: ru

book:
  title: "Sysuew"
  subtitle: "Шесть дисциплин в одном электронном издании"
  chapters:
    - index.qmd
    - part: "Численные методы"
      chapters:
        - subjects/numerical-methods/index.qmd
        - subjects/numerical-methods/lectures/01-gauss-simple-iterations.qmd
    - part: "ТВиМС"
      chapters:
        - subjects/probability-statistics/index.qmd
        - subjects/probability-statistics/lectures/lecture-01-multivariate-normal.qmd
    - part: "Криптография"
      chapters:
        - subjects/cryptography/index.qmd
    - part: "Машинное обучение"
      chapters:
        - subjects/machine-learning/index.qmd
        - subjects/machine-learning/lectures/lecture-01-intro-linear-regression.qmd
        - subjects/machine-learning/lectures/lecture-02-linear-regression.qmd
        - subjects/machine-learning/lectures/lecture-03-classification.qmd
    - part: "Базы данных"
      chapters:
        - subjects/databases/index.qmd
    - part: "Компьютерная графика"
      chapters:
        - subjects/computer-graphics/index.qmd
  page-navigation: true
  search: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    html-math-method: mathjax

editor: source
